# Production sur un serveur (VPS) hébergé dans l'Union européenne : voir docs/deploiement.md.
#   cd deploy && cp .env.production.example .env && (compléter) && docker compose -f compose.prod.yaml up -d
name: rostra

x-app: &app
  image: ${IMAGE:-ghcr.io/aceosolo/posts-auto:latest}
  build:
    context: ..
  env_file: .env
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-rostra}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}@postgres:5432/${POSTGRES_DB:-rostra}
    MEDIA_ROOT: /data/media
  volumes:
    - media:/data/media
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rostra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      POSTGRES_DB: ${POSTGRES_DB:-rostra}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rostra} -d ${POSTGRES_DB:-rostra}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    # Pas de port publié : la base n'est joignable que par les services ci-dessous.

  # Migrations appliquées avant le démarrage du web et des tâches de fond.
  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *app
    command: ["web"]

  worker:
    <<: *app
    command: ["worker"]
    healthcheck:
      disable: true

  # HTTPS automatique (Let's Encrypt), en-têtes de proxy, compression.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN manquant}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

  # Sauvegarde chaque nuit : base (pg_dump) et médias, 14 jours gardés sur le serveur ;
  # copie hors du serveur : voir docs/deploiement.md (indispensable).
  backup:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-rostra}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      PGDATABASE: ${POSTGRES_DB:-rostra}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
    volumes:
      - ./sauvegarde.sh:/usr/local/bin/sauvegarde.sh:ro
      - media:/data/media:ro
      - backups:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/sauvegarde.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: {}
  media: {}
  backups: {}
  caddy-data: {}
  caddy-config: {}
